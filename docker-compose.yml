# Local Postgres for dev and tests (required).
# After `docker compose up -d`, set DATABASE_URL in apps/backend/.env (see .env.example).
services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: flower
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change-me-locally}
      POSTGRES_DB: flower_shop
    ports:
      # 5433 on the host so it doesn't clash with a locally installed Postgres on 5432.
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

volumes:
  pgdata:
